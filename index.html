<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AES Encrypt / Decrypt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #eef2f3, #8e9eab);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 800px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    textarea {
      resize: vertical;
    }
    .output-box {
      background: #f8f9fa;
      border: 1px dashed #aaa;
      padding: 10px;
      border-radius: 8px;
      min-height: 120px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .btn i {
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div class="card p-4 bg-white">
  <h3 class="text-center text-primary fw-bold mb-4">🔐 AES Encrypt / Decrypt Tool</h3>

  <div class="mb-3">
    <label class="form-label">📁 Chọn File .txt</label>
    <input type="file" class="form-control" id="fileInput" accept=".txt">
  </div>

  <div class="mb-3">
    <label class="form-label">✍️ Nội dung (hoặc nhập thủ công)</label>
    <textarea id="inputText" class="form-control" rows="5" placeholder="Nhập văn bản hoặc chọn file..."></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">🔑 Khóa bí mật (tối thiểu 1 ký tự)</label>
    <input type="password" class="form-control" id="keyInput" placeholder="Nhập khóa AES...">
  </div>

  <div class="d-flex justify-content-center gap-2 mb-3">
    <button class="btn btn-primary" id="encryptBtn"><i class="bi bi-lock-fill"></i>Mã hóa</button>
    <button class="btn btn-success" id="decryptBtn"><i class="bi bi-unlock-fill"></i>Giải mã</button>
    <button class="btn btn-secondary" id="downloadBtn"><i class="bi bi-download"></i>Tải kết quả</button>
  </div>

  <div>
    <label class="form-label fw-bold">📄 Kết quả:</label>
    <div id="output" class="output-box"></div>
  </div>
</div>

<!-- Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
  document.getElementById("fileInput").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      document.getElementById("inputText").value = event.target.result;
    };
    reader.readAsText(file);
  });

  function strToArrayBuffer(str) {
    return new TextEncoder().encode(str);
  }

  function arrayBufferToStr(buf) {
    return new TextDecoder().decode(buf);
  }

  async function getKeyMaterial(password) {
    return window.crypto.subtle.importKey(
      "raw",
      strToArrayBuffer(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
  }

  async function aesEncrypt(plaintext, password) {
    const keyMaterial = await getKeyMaterial(password);
    const key = await window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: new TextEncoder().encode("static_salt"),
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      true,
      ["encrypt", "decrypt"]
    );

    const iv = window.crypto.getRandomValues(new Uint8Array(12));
    const encrypted = await window.crypto.subtle.encrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      strToArrayBuffer(plaintext)
    );

    const combined = new Uint8Array(iv.length + encrypted.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(encrypted), iv.length);
    return btoa(String.fromCharCode(...combined));
  }

  async function aesDecrypt(ciphertextB64, password) {
    try {
      const raw = atob(ciphertextB64);
      const combined = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) combined[i] = raw.charCodeAt(i);

      const iv = combined.slice(0, 12);
      const encrypted = combined.slice(12);

      const keyMaterial = await getKeyMaterial(password);
      const key = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: new TextEncoder().encode("static_salt"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
      );

      const decrypted = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: iv
        },
        key,
        encrypted
      );

      return arrayBufferToStr(decrypted);
    } catch (err) {
      throw new Error("❌ Giải mã thất bại hoặc sai khóa.");
    }
  }

  document.getElementById("encryptBtn").onclick = async function () {
    const text = document.getElementById("inputText").value.trim();
    const key = document.getElementById("keyInput").value;
    const output = document.getElementById("output");

    if (!text) return alert("⚠️ Vui lòng nhập nội dung.");
    if (!key || key.length < 1) return alert("⚠️ Vui lòng nhập khóa (≥ 1 ký tự).");

    try {
      const encrypted = await aesEncrypt(text, key);
      output.textContent = encrypted;
    } catch (e) {
      output.textContent = "Lỗi mã hóa: " + e.message;
    }
  };

  document.getElementById("decryptBtn").onclick = async function () {
    const text = document.getElementById("inputText").value.trim();
    const key = document.getElementById("keyInput").value;
    const output = document.getElementById("output");

    if (!text) return alert("⚠️ Vui lòng nhập nội dung cần giải mã.");
    if (!key || key.length < 1) return alert("⚠️ Vui lòng nhập khóa.");

    try {
      const decrypted = await aesDecrypt(text, key);
      output.textContent = decrypted;
    } catch (e) {
      output.textContent = e.message;
    }
  };

  document.getElementById("downloadBtn").onclick = function () {
    const result = document.getElementById("output").textContent;
    if (!result) return alert("⚠️ Không có dữ liệu để tải xuống.");
    const blob = new Blob([result], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "output.txt";
    a.click();
    URL.revokeObjectURL(a.href);
  };
</script>
</body>
</html>
