<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AES Encrypt/Decrypt without CryptoJS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
  #output {
    white-space: pre-wrap;
    min-height: 150px;
    background: #fff;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 5px;
  }
</style>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="text-center mb-4">AES Encrypt / Decrypt (Web Crypto API)</h3>

      <div class="mb-3">
        <label for="fileInput" class="form-label">📁 Chọn file .txt</label>
        <input type="file" class="form-control" id="fileInput" accept=".txt" />
      </div>

      <div class="mb-3">
        <label for="inputText" class="form-label">📄 Nội dung</label>
        <textarea id="inputText" class="form-control" rows="6" placeholder="Nội dung file hoặc nhập thủ công"></textarea>
      </div>

      <div class="mb-3">
        <label for="keyInput" class="form-label">🔑 Khóa (ít nhất 1 ký tự)</label>
        <input type="password" id="keyInput" class="form-control" placeholder="Nhập khóa bí mật" />
      </div>

      <div class="mb-3 d-flex gap-2 justify-content-center">
        <button class="btn btn-primary" id="encryptBtn">🔒 Mã hóa</button>
        <button class="btn btn-success" id="decryptBtn">🔓 Giải mã</button>
      </div>

      <h5>Kết quả:</h5>
      <div id="output"></div>

      <div class="mt-3 text-center">
        <button class="btn btn-secondary" id="downloadBtn">💾 Tải kết quả</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Hàm đọc file txt
  document.getElementById("fileInput").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      document.getElementById("inputText").value = event.target.result;
    };
    reader.readAsText(file);
  });

  // Chuyển string sang ArrayBuffer
  function strToArrayBuffer(str) {
    const encoder = new TextEncoder();
    return encoder.encode(str);
  }

  // Chuyển ArrayBuffer sang string
  function arrayBufferToStr(buf) {
    const decoder = new TextDecoder();
    return decoder.decode(buf);
  }

  // Mã hóa AES-GCM
  async function aesEncrypt(plaintext, keyStr) {
    const keyMaterial = await getKeyMaterial(keyStr);
    const key = await window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: new TextEncoder().encode("some_salt"),
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      true,
      ["encrypt", "decrypt"]
    );

    const iv = window.crypto.getRandomValues(new Uint8Array(12)); // IV 12 bytes

    const encrypted = await window.crypto.subtle.encrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      strToArrayBuffer(plaintext)
    );

    // Kết hợp IV + encrypted để gửi/luu
    const combined = new Uint8Array(iv.byteLength + encrypted.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(encrypted), iv.byteLength);

    // Mã hóa thành base64 để hiển thị
    return btoa(String.fromCharCode(...combined));
  }

  // Giải mã AES-GCM
  async function aesDecrypt(ciphertextB64, keyStr) {
    try {
      const data = atob(ciphertextB64);
      const combined = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) {
        combined[i] = data.charCodeAt(i);
      }

      const iv = combined.slice(0, 12); // 12 byte đầu là IV
      const encrypted = combined.slice(12);

      const keyMaterial = await getKeyMaterial(keyStr);
      const key = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: new TextEncoder().encode("some_salt"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
      );

      const decrypted = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: iv
        },
        key,
        encrypted
      );

      return arrayBufferToStr(decrypted);
    } catch (e) {
      throw new Error("Giải mã thất bại hoặc khóa sai.");
    }
  }

  // Lấy key material từ passphrase
  async function getKeyMaterial(password) {
    return window.crypto.subtle.importKey(
      "raw",
      strToArrayBuffer(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
  }

  // Sự kiện mã hóa
  document.getElementById("encryptBtn").onclick = async function () {
    const text = document.getElementById("inputText").value;
    const key = document.getElementById("keyInput").value;
    const output = document.getElementById("output");

    if (!text) {
      alert("Vui lòng nhập hoặc chọn nội dung.");
      return;
    }
    if (!key || key.length < 1) {
      alert("Khóa phải có ít nhất 1 ký tự.");
      return;
    }

    try {
      const encrypted = await aesEncrypt(text, key);
      output.textContent = encrypted;
    } catch (e) {
      output.textContent = "Mã hóa thất bại: " + e.message;
    }
  };

  // Sự kiện giải mã
  document.getElementById("decryptBtn").onclick = async function () {
    const text = document.getElementById("inputText").value;
    const key = document.getElementById("keyInput").value;
    const output = document.getElementById("output");

    if (!text) {
      alert("Vui lòng nhập hoặc chọn nội dung.");
      return;
    }
    if (!key || key.length < 1) {
      alert("Khóa phải có ít nhất 1 ký tự.");
      return;
    }

    try {
      const decrypted = await aesDecrypt(text, key);
      output.textContent = decrypted;
    } catch (e) {
      output.textContent = "Giải mã thất bại: " + e.message;
    }
  };

  // Tải kết quả xuống file .txt
  document.getElementById("downloadBtn").onclick = function () {
    const text = document.getElementById("output").textContent;
    if (!text) {
      alert("Không có dữ liệu để tải.");
      return;
    }
    const blob = new Blob([text], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "output.txt";
    a.click();
    URL.revokeObjectURL(a.href);
  };
</script>

</body>
</html>
